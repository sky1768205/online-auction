services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lot
      POSTGRES_USER: lot
      POSTGRES_PASSWORD: lot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lot"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://lot:lot@db:5432/lot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WS_ALLOWED_ORIGINS: localhost:8000,127.0.0.1:8000
    volumes: [uploads:/uploads]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8000:80"]

volumes:
  pgdata:
  uploads:
